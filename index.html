<style>
/* Layout: pastel course tiles under a calm top bar, with a month calendar pinned beside the upcoming dates. */
:root {

  --tile-s: 72%; --tile-l: 90%; --tile-deep: 82%; --tag-l: 97%;
  --shadow: 0 1px 2px rgba(60, 66, 110, .05), 0 10px 26px rgba(60, 66, 110, .07);
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171a24; --panel: #202431; --line: #333849; --fg: #eceef7; --muted: #a9aec5;
  --accent: #4a5690; --accent-fg: #eceef7; --accent-strong: #b9c6f5; --accent-soft: #2c3350;
  --mark: #6b5a22; --mark-fg: #fff3cf; --warn: #f0b3a0; --warn-soft: #4a2f2a;
  --tile-s: 30%; --tile-l: 27%; --tile-deep: 34%; --tag-l: 20%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171a24; --panel: #202431; --line: #333849; --fg: #eceef7; --muted: #a9aec5;
  --accent: #4a5690; --accent-fg: #eceef7; --accent-strong: #b9c6f5; --accent-soft: #2c3350;
  --mark: #6b5a22; --mark-fg: #fff3cf; --warn: #f0b3a0; --warn-soft: #4a2f2a;
  --tile-s: 30%; --tile-l: 27%; --tile-deep: 34%; --tag-l: 20%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .25); color-scheme: dark }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
h1, h2, h3 { font-weight: 800; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; letter-spacing: -.01em; } h2 { font-size: 1.25rem; } h3 { font-size: 1.02rem; }
mark { background: var(--mark); color: var(--mark-fg); border-radius: 3px; padding: 0 2px; }
.muted { color: var(--muted); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); box-shadow: 0 1px 0 var(--line);
  padding-block: 12px; padding-left: max(clamp(16px, 3.5vw, 48px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3.5vw, 48px), env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.brand { font-weight: 800; font-size: 1.08rem; }
.themebtn { flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--bg); color: var(--fg); }
.themebtn:hover { background: var(--accent-soft); }
.themebtn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.themebtn .sun { display: none; }
.semnav { display: contents; }
#lockBtn.on { background: var(--accent); color: var(--accent-fg); }
@media (max-width: 1100px) { #lockBtn { order: 2; margin-left: auto; } #lockBtn + .themebtn { margin-left: 0; } }
.dlg p { margin: 0; font-size: .92rem; color: var(--muted); }
.dlg ol { margin: 0; padding-left: 1.2em; font-size: .9rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.dlg a { color: var(--accent-strong); }
/* ha a fejléc több sorba törik, a kapcsoló akkor is a jobb felső sarokban marad */
@media (max-width: 1100px) { .top .brand { order: 0; } .nav { order: 1; } .themebtn { order: 2; margin-left: auto; } .searchbox { order: 3; flex-basis: 100%; } }
@media (max-width: 820px) { .themebtn { order: 1; } .nav { order: 2; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .themebtn .sun { display: block; } :root:not([data-theme="light"]) .themebtn .moon { display: none; } }
:root[data-theme="dark"] .themebtn .sun { display: block; } :root[data-theme="dark"] .themebtn .moon { display: none; }
.semester { margin: 4px 0 0; font-size: 1.1rem; font-weight: 800; color: var(--muted); }
[id^="felev"] { scroll-margin-top: 90px; }
.semhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.addsem { padding: 10px 18px; border-radius: 14px; font-weight: 800; color: var(--accent-strong); border: 1.5px dashed var(--line); }
.addsem:hover { background: var(--accent-soft); }
.bandedit { align-self: flex-start; font-size: .9rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: var(--panel); }
.bandedit:hover { box-shadow: var(--shadow); }
.dlg.wide { width: min(760px, 100%); }
.dlg textarea { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-weight: 500; min-height: 76px; resize: vertical; }
.dlg h3 { font-size: .95rem; margin-top: 4px; }
.fldgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.rowlist { display: flex; flex-direction: column; gap: 8px; }
.taskrow { display: grid; grid-template-columns: minmax(0, 1.4fr) 5em minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr) 34px; gap: 6px; align-items: end; }
.studyrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) 34px; gap: 6px; align-items: end; }
.taskrow .fld span, .studyrow .fld span { font-size: .76rem; }
.rowdel { height: 38px; border-radius: 10px; color: var(--muted); }
.rowdel:hover { background: var(--warn-soft); color: var(--warn); }
.addrow { align-self: flex-start; color: var(--accent-strong); font-weight: 800; font-size: .9rem; }
.importbox { padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 640px) { .taskrow { grid-template-columns: 1fr 1fr; } .taskrow .rowdel { grid-column: 2; justify-self: end; width: 38px; } }
.searchbox { flex: 1 1 260px; min-width: 0; display: flex; }
.searchbox input { flex: 1; min-width: 0; padding: 9px 16px; border: 1px solid transparent; border-radius: 99px; background: var(--bg); }
.searchbox input:focus { border-color: var(--accent); background: var(--panel); outline: none; }
.nav { display: flex; gap: 8px; }
.nav button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 14px; font-weight: 800; background: hsl(var(--h) var(--tile-s) var(--tile-l)); }
.nav svg { flex: none; width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { background: hsl(var(--h) var(--tile-s) var(--tile-deep)); }
.nav button[aria-current="true"] { background: hsl(var(--h) var(--tile-s) var(--tile-deep)); box-shadow: inset 0 0 0 2px hsl(var(--h) 48% 60%); }

main { padding-block: 28px 56px;
  padding-left: max(clamp(16px, 3.5vw, 48px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3.5vw, 48px), env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 28px; }
.sect { display: flex; flex-direction: column; gap: 12px; }
.lead { margin: 6px 0 0; color: var(--muted); }
.panel { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.empty { padding: 14px 16px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted); font-size: .94rem; }

.board { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.calhead b { font-weight: 800; }
.calhead button { width: 30px; height: 30px; border-radius: 50%; text-align: center; font-weight: 800; }
.calhead button:hover { background: var(--accent-soft); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.cal .wd { font-size: .74rem; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
.cal .day { display: flex; flex-direction: column; align-items: center; gap: 2px; aspect-ratio: 1; max-width: 100%; padding-top: 5px; border-radius: 10px; font-size: .9rem; font-variant-numeric: tabular-nums; text-align: center; }
.cal .past { color: var(--muted); opacity: .6; }
.cal .today { background: var(--accent); color: var(--accent-fg); font-weight: 800; opacity: 1; }
.cal button.day { background: hsl(var(--h) var(--tile-s) var(--tile-l)); font-weight: 800; }
.cal button.day:hover, .cal button.day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent-strong); }
.dots { display: flex; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--h) 45% 58%); }
.dues { display: flex; flex-direction: column; gap: 8px; }
.duewrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: stretch; }
.evedit { width: 34px; border-radius: 12px; text-align: center; color: var(--muted); font-size: 1rem; }
.evedit:hover { background: var(--accent-soft); color: var(--fg); }
.dueacts { display: flex; gap: 12px; align-items: baseline; }
.addev { color: var(--accent-strong); font-size: .9rem; font-weight: 800; }
.addev:hover { text-decoration: underline; }
.dlgback { position: fixed; inset: 0; z-index: 20; background: rgba(15, 18, 30, .45); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { --h: 225; width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 700; color: var(--muted); min-width: 0; }
.fld input, .fld select { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-weight: 600; min-width: 0; }
.fld input:focus, .fld select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.fldrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.delbtn { margin-left: auto; padding: 8px 14px; border-radius: 99px; font-weight: 700; color: var(--warn); }
.delbtn:hover { background: var(--warn-soft); }
.duepanel { display: flex; flex-direction: column; }
.duepanel .dues { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
@media (min-width: 821px) { .board { align-items: stretch; } .duepanel { contain: size; } }
@media (max-width: 820px) { .duepanel .dues { max-height: 380px; } }
.duehead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.duehead button { color: var(--accent-strong); font-size: .9rem; font-weight: 700; }
.due { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 8px 12px 8px 8px; border-radius: 14px; background: hsl(var(--h) var(--tile-s) var(--tag-l)); }
.due:hover { background: hsl(var(--h) var(--tile-s) var(--tile-l)); }
.date { display: flex; flex-direction: column; align-items: center; padding: 4px 0; border-radius: 10px; background: hsl(var(--h) var(--tile-s) var(--tile-deep)); line-height: 1.1; }
.date b { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.date small { font-size: .7rem; font-weight: 700; }
.due strong { display: block; font-weight: 800; line-height: 1.25; }
.due span.sub { display: block; font-size: .85rem; color: var(--muted); line-height: 1.25; }
.left { font-size: .82rem; font-weight: 800; white-space: nowrap; }
.left.soon { padding: 2px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.tile { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 142px; width: 100%; padding: 16px 18px; border-radius: 18px;
  background: hsl(var(--h) var(--tile-s) var(--tile-l)); transition: transform .15s, box-shadow .15s; }
.tile::after { content: ""; position: absolute; right: -34px; top: -34px; width: 104px; height: 104px; border-radius: 50%; background: hsl(var(--h) var(--tile-s) var(--tile-deep)); }
.tile:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
/* teljesített tárgy: kifakult, nem aktív */
.tile.done { --tile-s: 0%; color: var(--muted); }
.tile.done .mini i { background: var(--muted); opacity: .6; }

.tile.done .next { color: var(--muted); }
.tile.done:hover { box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.tile.done .meta, .tile.done .mini { margin-right: 58px; }
.gradebig { position: absolute; z-index: 1; bottom: 12px; right: 16px; display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: 2.2rem; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; }
.gradebig small { font-size: .7rem; font-weight: 800; color: var(--muted); margin-bottom: 2px; }
.tile b { position: relative; z-index: 1; display: block; max-width: 86%; font-weight: 800; font-size: 1.08rem; line-height: 1.22; text-wrap: balance; }
.tile .meta { margin-top: auto; font-size: .88rem; font-variant-numeric: tabular-nums; }
.tile .next { position: relative; z-index: 1; align-self: flex-start; font-size: .8rem; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: var(--panel); }
.mini { height: 6px; border-radius: 99px; background: hsl(var(--h) var(--tile-s) var(--tile-deep)); overflow: hidden; }
.mini i { display: block; height: 100%; border-radius: 99px; background: hsl(var(--h) 48% 58%); }

.band { position: relative; overflow: hidden; border-radius: 22px; padding: 20px 24px; background: hsl(var(--h) var(--tile-s) var(--tile-l)); display: flex; flex-direction: column; gap: 6px; }
.band::after { content: ""; position: absolute; right: -40px; bottom: -70px; width: 190px; height: 190px; border-radius: 50%; background: hsl(var(--h) var(--tile-s) var(--tile-deep)); }
.band > * { position: relative; z-index: 1; }
.back { align-self: flex-start; font-size: .9rem; font-weight: 700; }
.back:hover { text-decoration: underline; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 16px; }

.score { display: flex; flex-direction: column; gap: 10px; }
.score .big { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.score .big small { font-size: 1rem; color: var(--muted); font-weight: 700; }
.bar { position: relative; height: 14px; border-radius: 99px; background: hsl(var(--h) var(--tile-s) var(--tile-l)); }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: hsl(var(--h) 48% 60%); }
.bar .need { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); border-radius: 2px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: .94rem; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.parts { display: flex; flex-direction: column; gap: 6px; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .94rem; }
.part:first-child { border-top: 0; }
.part b { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.syl { display: flex; flex-direction: column; gap: 14px; }
.syl h3 { font-size: 1rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 0; }
.facts div { padding: 10px 12px; border-radius: 14px; background: hsl(var(--h) var(--tile-s) var(--tag-l)); min-width: 0; }
.facts dt { font-size: .76rem; font-weight: 800; color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.goal { margin: 0; }
.syl .panel { display: flex; flex-direction: column; gap: 8px; }
.part.sum { font-weight: 800; border-top: 2px solid var(--line); }
.rules { margin: 4px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: .94rem; }
details.panel summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.panel summary::-webkit-details-marker { display: none; }
details.panel summary::before { content: "›"; font-weight: 800; transition: transform .15s; }
details.panel[open] summary::before { transform: rotate(90deg); }
.topics { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-size: .94rem; }
.scorehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.editbtn { font-size: .86rem; font-weight: 800; padding: 6px 12px; border-radius: 99px; background: hsl(var(--h) var(--tile-s) var(--tile-l)); }
.editbtn:hover { background: hsl(var(--h) var(--tile-s) var(--tile-deep)); }
.editform { display: flex; flex-direction: column; gap: 8px; }
.numrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .94rem; }
.numfield { display: flex; align-items: center; gap: 6px; }
.numfield input, .numrow select { width: 5.5em; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-variant-numeric: tabular-nums; text-align: right; }

.numfield input:focus, .numrow select:focus { outline: 2px solid hsl(var(--h) 48% 60%); outline-offset: 1px; }
.numfield small { color: var(--muted); font-size: .84rem; min-width: 3.2em; }
.formhint { margin: 2px 0 0; font-size: .82rem; color: var(--muted); }

.formbtns { display: flex; gap: 8px; margin-top: 4px; }

.cancelbtn:hover { background: var(--accent-soft); color: var(--fg); }
.dbnote { margin: 4px 0 0; font-size: .82rem; color: var(--muted); }
.score h3 { margin-top: 6px; font-size: .95rem; color: var(--muted); }
.bar .need { opacity: .45; }

.tile .meta small { display: block; font-size: .82rem; color: var(--muted); }

.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.doc { display: flex; flex-direction: column; gap: 6px; min-height: 104px; padding: 12px 14px; border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); text-decoration: none; }
.doc:hover { background: hsl(var(--h) var(--tile-s) var(--tag-l)); transform: translateY(-1px); }

.doc .meta { margin-top: auto; color: var(--muted); font-size: .84rem; }
.tag { align-self: flex-start; font-size: .74rem; font-weight: 800; padding: 1px 9px; border-radius: 99px; background: hsl(var(--h) var(--tile-s) var(--tile-l)); }

.study { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; justify-content: space-between; padding: 18px 20px; border-radius: 18px; background: var(--panel); box-shadow: var(--shadow), inset 0 0 0 2px hsl(var(--h) 50% 75%); }
.study p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; max-width: 55ch; }
.studies { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; align-content: start; }
.studies .study { flex-direction: column; align-items: flex-start; justify-content: space-between; min-height: 150px; }
.study .when { display: inline-block; margin-left: 4px; padding: 0 8px; border-radius: 99px; font-size: .8rem; font-weight: 800; color: var(--fg); background: hsl(var(--h) var(--tile-s) var(--tile-l)); }
.study.off { box-shadow: none; background: var(--bg); border: 1.5px dashed var(--line); }
.study.off h2 { color: var(--muted); }
.study.off .when { background: var(--line); color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 99px; background: hsl(var(--h) 48% 60%); color: #fff; font-weight: 800; text-decoration: none; white-space: nowrap; }
.btn:hover { background: hsl(var(--h) 48% 52%); }
.btn[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }

.hit { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.hit:hover { box-shadow: var(--shadow), inset 0 0 0 2px hsl(var(--h) 50% 72%); }
.hit .where { display: flex; gap: 8px; align-items: center; font-size: .86rem; color: var(--muted); }
.hit .where i { display: block; width: 12px; height: 12px; border-radius: 50%; background: hsl(var(--h) var(--tile-s) var(--tile-deep)); flex: none; }
.hits { display: flex; flex-direction: column; gap: 10px; max-width: 80ch; }

@media (max-width: 820px) {
  .nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
  .board, .cols { grid-template-columns: minmax(0, 1fr); }

}

const app = document.getElementById("app");
const q = document.getElementById("q");
const MONTHS = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const MON_SHORT = ["jan","febr","márc","ápr","máj","jún","júl","aug","szept","okt","nov","dec"];
const WD = ["H","K","Sze","Cs","P","Szo","V"];
const byId = Object.fromEntries(COURSES.map(c => [c.id, c]));
/* A beírt eredmények a megosztott adatbázisban vannak (results/<tárgy>), a fenti adatok csak az alapértékek */
const BASE = Object.fromEntries(COURSES.map(c => [c.id, JSON.parse(JSON.stringify({ parts: c.parts, bonus: c.bonus, grade: c.grade, status: c.status }))]));
const BASE_COURSES = JSON.parse(JSON.stringify(COURSES));
const BASE_SYLLABUS = JSON.parse(JSON.stringify(SYLLABUS));
const GRADE_NAME = { 1: "elégtelen", 2: "elégséges", 3: "közepes", 4: "jó", 5: "jeles" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysLeft = s => Math.round((parse(s) - today) / 864e5);
const leftLabel = n => n === 0 ? "ma" : n === 1 ? "holnap" : `${n} nap`;
/* A naptár: az alap dátumok (b0, b1, …) plusz a beírt módosítások és új dátumok (events/<id>) */
BASE_EVENTS.forEach((e, i) => { e.id = "b" + i; });
let EVENTS = BASE_EVENTS.map(e => ({ ...e }));
const sorted = () => [...EVENTS].sort((a,b) => a.date.localeCompare(b.date));
const upcoming = id => sorted().filter(e => e.date >= TODAY && (!id || e.course === id));
const hueOf = e => byId[e.course]?.h ?? 225;

let state = { view: "naptar", course: null, month: new Date(today.getFullYear(), today.getMonth(), 1), day: null };

function dueRow(e) {
  const d = parse(e.date), n = daysLeft(e.date), c = byId[e.course];
  const row = `<button class="due" type="button" style="--h:${hueOf(e)}" data-course="${esc(e.course)}">
    <span class="date"><b>${d.getDate()}</b><small>${MON_SHORT[d.getMonth()]}</small></span>
    <span><strong>${esc(e.title)}</strong><span class="sub">${e.time ? esc(e.time) + " · " : ""}${esc(c?.name ?? "")}${e.note ? " · " + esc(e.note) : ""}</span></span>
    <span class="left${n >= 0 && n <= 7 ? " soon" : ""}">${n >= 0 ? leftLabel(n) : "lezajlott"}</span></button>`;
  return canWrite ? `<div class="duewrap">${row}<button type="button" class="evedit" data-evedit="${esc(e.id)}" aria-label="${esc(e.title)} szerkesztése" title="Szerkesztés">✎</button></div>` : row;
}

function calendar() {
  const m = state.month, y = m.getFullYear(), mo = m.getMonth();
  const first = (new Date(y, mo, 1).getDay() + 6) % 7, len = new Date(y, mo + 1, 0).getDate();
  let cells = WD.map(w => `<span class="wd">${w}</span>`).join("") + "<span></span>".repeat(first);
  for (let d = 1; d <= len; d++) {
    const key = iso(new Date(y, mo, d)), evs = EVENTS.filter(e => e.date === key);
    const cls = ["day", key < TODAY ? "past" : "", key === TODAY ? "today" : ""].join(" ");
    if (evs.length) {
      cells += `<button type="button" class="${cls}" style="--h:${hueOf(evs[0])}" data-day="${key}" aria-pressed="${state.day === key}" aria-label="${d}. – ${evs.length} esemény">${d}<span class="dots">${evs.slice(0,3).map(e => `<i style="--h:${hueOf(e)}"></i>`).join("")}</span></button>`;
    } else cells += `<span class="${cls}">${d}</span>`;
  }
  cells += `<span class="day" aria-hidden="true"></span>`.repeat(42 - first - len);
  return `<div class="panel">
    <div class="calhead"><button type="button" data-month="-1" aria-label="Előző hónap">‹</button><b>${y}. ${MONTHS[mo]}</b><button type="button" data-month="1" aria-label="Következő hónap">›</button></div>
    <div class="cal">${cells}</div></div>`;
}

const fmt = n => n == null ? "–" : Number(n).toLocaleString("hu-HU", { maximumFractionDigits: 2 });
const sum = (xs, f) => xs.reduce((s, x) => s + f(x), 0);
function stats(c) {
  const ps = c.parts; if (!ps.length) return null;
  const done = ps.filter(p => p.score != null), left = ps.filter(p => p.score == null);
  const max = ps.every(p => p.max != null) ? sum(ps, p => p.max) : null;
  const leftMax = left.every(p => p.max != null) ? sum(left, p => p.max) : null;
  const total = sum(done, p => p.score) + (c.bonus?.score ?? 0);
  return { done: done.length, count: ps.length, left: left.length, max, leftMax, total, pc: max ? Math.min(100, Math.round(total / max * 100)) : null };
}

/* Jegyhatárok — minden tárgynál a maximális pontszám százalékában */
const GRADES = [
  { g: 2, name: "Elégséges", to: "elégségeshez", pc: 59.5 },
  { g: 3, name: "Közepes", to: "közepeshez", pc: 69.5 },
  { g: 4, name: "Jó", to: "jóhoz", pc: 79.5 },
  { g: 5, name: "Jeles", to: "jeleshez", pc: 89.5 },
];
function gradeInfo(s) {
  if (!s?.max) return null;
  const rows = GRADES.map(g => { const pts = g.pc / 100 * s.max, miss = Math.max(0, pts - s.total);
    return { ...g, pts, miss, ok: miss === 0, reachable: s.leftMax == null || miss <= s.leftMax }; });
  const cur = [...rows].reverse().find(r => r.ok) || null, next = rows.find(r => !r.ok) || null;
  return { rows, cur, next };
}

  const tile = c => {
    const nx = upcoming(c.id)[0], s = stats(c);

      ${chip ? `<span class="next">${chip}</span>` : ""}
      <span class="meta">${s ? `<strong>${fmt(s.total)}${s.max != null ? " / " + fmt(s.max) : ""} pont</strong>${c.bonus ? ` · ebből ${fmt(c.bonus.score)} plusz` : ""}<small>${s.done} / ${s.count} számonkérés megírva</small>${(() => { const gi = c.grade == null && gradeInfo(s); if (!gi) return "";
        return `<small>${gi.cur ? `Most: ${gi.cur.name.toLowerCase()} (${gi.cur.g})` : ""}${gi.cur && gi.next ? " · " : ""}${gi.next ? `${gi.next.to} még ${fmt(gi.next.miss)} pont` : ""}</small>`; })()}` : "Pontok hamarosan"}</span>

      ${list.length ? `<div class="grid">${list.map(tile).join("")}</div>` : `<div class="empty">Ebben a félévben még nincs tárgy.${canWrite ? " Az „+ Új tárgy” gombbal vehetsz fel egyet." : ""}</div>`}</section>`;
  };
  return `<div class="stack">
    <div><h1>Naptár</h1><p class="lead">A félév ZH-i, vizsgái és beadandói egy helyen. Kattints egy tárgyra az anyagokért, a pontjaidért és a tanulóoldalért.</p></div>
    <section class="board" aria-label="Naptár és határidők">${calendar()}
      <div class="panel duepanel"><div class="duehead"><h2>${dayTitle}</h2><span class="dueacts">${state.day ? `<button type="button" id="clearday">Összes közelgő</button>` : ""}${canWrite ? `<button type="button" class="addev" data-evnew="">+ Új dátum</button>` : ""}</span></div><div class="dues">${dues}</div></div>
    </section>
    ${sems.map(semSection).join("")}
    ${canWrite ? `<div><button type="button" class="addsem" id="addSem">+ Új félév</button></div>` : ""}
  </div>`;
}

function viewCourse(c) {
  const s = stats(c);
  const needPos = c.need != null && s?.max ? Math.min(100, c.need / s.max * 100) : null;
  const score = s ? `
      <div class="big">${fmt(s.total)}<small> / ${s.max != null ? fmt(s.max) : "?"} pont</small></div>

      <div class="ticks" aria-hidden="true">${GRADES.map(g => `<span style="left:${g.pc}%">${g.g}</span>`).join("")}</div>` : ""}
      <dl class="kv">
        <dt>Megírva</dt><dd>${s.done} / ${s.count} számonkérés</dd>
        ${(() => { const y = SYLLABUS[c.id]; if (!y?.zhMin) return ""; const z = sum(c.parts.filter(p => /ZH|Vizsga/.test(p.name) && p.score != null), p => p.score);
          return `<dt>ZH-minimum</dt><dd>${fmt(z)} / ${y.zhMin}${z >= y.zhMin ? " ✓" : ` (még ${fmt(y.zhMin - z)})`}</dd>`; })()}
        ${s.left ? `<dt>Még szerezhető</dt><dd>${s.leftMax != null ? fmt(s.leftMax) + " pont" : "–"}</dd>` : ""}
        ${c.bonus ? `<dt>Plusz pont</dt><dd>${fmt(c.bonus.score)} / ${fmt(c.bonus.max)}${c.bonus.score >= c.bonus.max ? " ✓" : ""}</dd>` : ""}
        ${c.need != null ? `<dt>Szükséges</dt><dd>${fmt(c.need)} pont</dd><dt>Hiányzik még</dt><dd>${fmt(Math.max(0, c.need - s.total))} pont</dd>` : ""}

function viewKereses() {

  let hits = [];

      for (const m of c.materials) if ([m.title, m.meta, m.tag].join(" ").toLowerCase().includes(term)) hits.push({ c, kind: "Előadásanyag", title: m.title, sub: m.meta });
    }
    for (const e of sorted()) { const c = byId[e.course]; if ([e.title, e.note, e.time, c?.name].join(" ").toLowerCase().includes(term)) hits.push({ c, kind: "Dátum · " + e.date.replaceAll("-", ". ") + ".", title: e.title, sub: e.note }); }

let dbApi = null, canWrite = false, editing = null, dbState = "off", editError = "";
function applyResults(docs) {

/* Érdemjegy: ha minden számonkérés pontja megvan, a jegyhatárokból (és a ZH-minimumból) számolódik */
function autoGrade(c) {
  const s = stats(c);
  if (!s || s.left > 0 || !s.max) return null;
  const zhMin = SYLLABUS[c.id]?.zhMin;
  if (zhMin && sum(c.parts.filter(p => /ZH|Vizsga/.test(p.name)), p => p.score) < zhMin) return 1;
  const pc = s.total / s.max * 100;
  return pc >= 89.5 ? 5 : pc >= 79.5 ? 4 : pc >= 69.5 ? 3 : pc >= 59.5 ? 2 : 1;
}
function setGrades() {
  for (const c of COURSES) {
    c.grade = autoGrade(c);
    c.status = c.grade >= 2 ? `Teljesítve, ${GRADE_NAME[c.grade]} (${c.grade}) érdemjeggyel.`
      : c.grade === 1 ? "A beírt pontok alapján elégtelen (1). A ZH vizsgajelleggel pótolható." : "";
  }
}

function readNum(id, max) {

  const v = Number(raw);
  if (!Number.isFinite(v) || v < 0 || (max != null && v > max)) return { err: true };
  return { v: Math.round(v * 100) / 100 };
}
async function saveResults(c) {

/* ===== Tárgyak felvétele és szerkesztése =====
   A tárgyak adatai a data.json "courses" részében vannak; a beépített tárgyak ugyanígy felülírhatók. */
const HUES = [225, 150, 28, 285, 190, 345, 55, 5, 265, 120, 205, 95, 320, 170, 40];
const pickHue = () => HUES.find(h => !COURSES.some(c => c.h === h)) ?? HUES[COURSES.length % HUES.length];
const ROMAN = ["I", "II", "III", "IV", "V"];
const numOrNull = v => { const x = Number(String(v ?? "").replace(",", ".")); return String(v ?? "").trim() === "" || !Number.isFinite(x) ? null : x; };
function semesters() {
  const set = new Set(COURSES.map(c => c.sem ?? 2));
  (STORE.meta?.semesters?.list || []).forEach(n => set.add(n));
  if (!set.size) set.add(1);
  return [...set].sort((a, b) => b - a);
}
function fromDef(id, d, b) {
  const old = n => b?.parts.find(p => p.name === n);
  return {
    id, name: d.name, sem: Number(d.sem) || 1, h: d.h ?? b?.h ?? 225,
    parts: (d.tasks || []).filter(t => t.name).map(t => ({ name: t.name, date: t.date || null, time: t.time || "", max: numOrNull(t.max), score: old(t.name)?.score ?? null })),
    bonus: numOrNull(d.bonusMax) ? { max: numOrNull(d.bonusMax), score: b?.bonus?.score ?? 0 } : null,
    need: null, grade: null, status: "",
    study: Object.fromEntries((d.study || []).filter(x => x.name && x.url).map(x => [x.name, { url: x.url, desc: x.desc || "" }])),
    materials: [], custom: !b,
  };
}
function sylFromDef(d) {
  const tasks = (d.tasks || []).filter(t => t.name).map(t => [t.name, numOrNull(t.max) ?? 0, t.form || ""]);
  return { code: d.code || "", credit: d.credit ?? "", owner: d.owner || "", dept: d.dept || "", eval: d.eval || "", goal: d.goal || "",
    tasks, bonusMax: numOrNull(d.bonusMax), zhMin: numOrNull(d.zhMin), zhMax: sum(tasks.filter(t => /ZH|Vizsga/.test(t[0])), t => t[1]),
    totalMin: numOrNull(d.totalMin) ?? 60, retake: d.retake || "", topics: d.topics || [], lit: d.lit || [] };
}
function applyCourses() {
  const defs = STORE.courses || {};
  COURSES.length = 0;
  for (const b of BASE_COURSES) {
    const d = defs[b.id];
    if (d?.hidden) continue;
    COURSES.push(d?.name ? fromDef(b.id, d, b) : JSON.parse(JSON.stringify(b)));
  }
  for (const [id, d] of Object.entries(defs)) if (!BASE_COURSES.some(b => b.id === id) && !d.hidden && d.name) COURSES.push(fromDef(id, d));
  for (const k of Object.keys(byId)) delete byId[k];
  COURSES.forEach(c => { byId[c.id] = c; });
  for (const k of Object.keys(SYLLABUS)) delete SYLLABUS[k];
  Object.assign(SYLLABUS, JSON.parse(JSON.stringify(BASE_SYLLABUS)));
  for (const [id, d] of Object.entries(defs)) if (!d.hidden && d.name) SYLLABUS[id] = sylFromDef(d);
  for (const k of Object.keys(BASE)) delete BASE[k];
  COURSES.forEach(c => { BASE[c.id] = JSON.parse(JSON.stringify({ parts: c.parts, bonus: c.bonus, grade: c.grade, status: c.status })); });
}
/* A szerkesztőbe a tárgy jelenlegi adatai kerülnek */
function courseDef(id) {
  const c = byId[id], y = SYLLABUS[id] || {};
  const formOf = n => (y.tasks || []).find(t => t[0] === n || t[0].startsWith(n))?.[2] || "";
  const timeOf = p => p.time || BASE_EVENTS.find(e => e.course === id && e.date === p.date)?.time || "";
  return { name: c.name, sem: c.sem ?? 2, h: c.h, code: y.code || "", credit: y.credit ?? "", owner: y.owner || "", dept: y.dept || "",
    eval: y.eval || "", goal: y.goal || "",
    tasks: c.parts.map(p => ({ name: p.name, max: p.max ?? "", date: p.date || "", time: timeOf(p), form: formOf(p.name) })),
    bonusMax: y.bonusMax ?? c.bonus?.max ?? "", zhMin: y.zhMin ?? "", totalMin: y.totalMin ?? 60, retake: y.retake || "",
    topics: y.topics || [], lit: y.lit || [],
    study: Object.entries(c.study || {}).map(([k, v]) => ({ name: k, url: v.url, desc: v.desc || "" })) };
}

function collectCourse() {

  const d = coDraft;

  d.owner = v("co-owner"); d.dept = v("co-dept"); d.eval = v("co-eval"); d.goal = v("co-goal");
  d.tasks = d.tasks.map((t, i) => ({ name: v(`co-tn${i}`), max: v(`co-tm${i}`), date: v(`co-td${i}`), time: v(`co-tt${i}`), form: v(`co-tf${i}`) }));

async function saveCourse() {
  collectCourse();

  for (const x of d.study) if (x.url && !/^https?:\/\//.test(x.url)) return drawCourseDialog("A tanulóoldal linkje https://-sel kezdődjön.");

/* ----- BGE tantárgyleírás-Excel beolvasása (SheetJS) ----- */
let xlsxLib = null;
function loadXlsx() {
  return xlsxLib ??= new Promise((ok, bad) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { xlsxLib = null; bad(new Error("xlsx")); };
    document.head.appendChild(sc);
  });
}
function parseBGE(XLSX, wb) {
  const rows = ws => XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: "" }).map(r => {
    const out = []; for (const v of r) { const t = String(v).replace(/\s+/g, " ").trim(); if (t && out[out.length - 1] !== t) out.push(t); } return out;
  }).filter(r => r.length);
  const [s1 = [], s2 = [], s3 = []] = wb.SheetNames.slice(0, 3).map(n => rows(wb.Sheets[n]));
  const val = (sh, label) => { const r = sh.find(r => r[0].includes(label)); return r && r.length > 1 ? r[r.length - 1] : ""; };
  const after = (sh, start, stop) => { const i = sh.findIndex(r => r[0].startsWith(start)); if (i < 0) return []; const out = [];
    for (const r of sh.slice(i + 1)) { if (stop.some(x => r[0].startsWith(x))) break; out.push(r); } return out; };
  const d = {};
  d.name = (val(s1, "Tantárgy neve:") || val(s2, "Tantárgy neve:")).replace(/\s*\((új|kifutó|GT|MSc)\)\s*$/i, "");
  d.code = val(s1, "Neptun-kód") || val(s2, "Neptunkód") || val(s3, "Neptun-kód");
  d.credit = val(s1, "kreditértéke"); d.owner = val(s1, "Tantárgy felelőse"); d.dept = val(s1, "szervezeti egysége");
  d.eval = val(s1, "Értékelés típusa");
  d.goal = after(s2, "A tantárgy tanítási célja", ["Ismeretkörök"]).map(r => r.join(" ")).join(" ");
  d.topics = after(s2, "Ismeretkörök", ["Kötelező irodalom"]).filter(r => /^\d+\.$/.test(r[0]) && r.length > 1).map(r => r.slice(1).join(" "));
  d.lit = after(s2, "Kötelező irodalom", ["~"]).map(r => r.join(" · "));
  const tasks = [];
  const iTask = s3.findIndex(r => r[0].startsWith("Félévközi tanórán kívüli") && r.includes("Meghatározás"));
  const iZh = s3.findIndex(r => r[0] === "Zárthelyi dolgozat" && r.includes("Pontszám"));
  const take = (from, kind) => { if (from < 0) return; for (const r of s3.slice(from + 1)) { if (!/^\d+\.$/.test(r[0])) break;
    const pts = numOrNull(r[2]); if (r.length < 3 || pts == null) continue;
    const n = parseInt(r[0], 10);
    if (kind === "zh") tasks.push({ name: `${ROMAN[n - 1] || n}. ZH`, max: pts, date: "", time: "", form: r[3] || "" });
    else tasks.push({ name: r[1].charAt(0).toUpperCase() + r[1].slice(1), max: pts, date: "", time: "", form: r[3] ? `Határidő: ${r[3]}` : "" }); } };
  take(iZh, "zh"); take(iTask, "task");
  d.tasks = tasks;
  d.bonusMax = numOrNull(val(s3, "maximális többletpontszám")) ?? "";
  d.zhMin = numOrNull(val(s3, "Zárthelyi dolgozati összpontszám minimuma")) || "";
  d.totalMin = numOrNull(val(s3, "Féléves összpontszám minimuma")) ?? 60;
  return d;
}
async function importExcel(file) {
  collectCourse();
  const st = document.getElementById("co-xstatus"); if (st) st.textContent = "Beolvasás…";
  try {
    const XLSX = await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const x = parseBGE(XLSX, wb), d = coDraft;
    for (const k of ["name", "code", "credit", "owner", "dept", "eval", "goal"]) if (x[k]) d[k] = x[k];
    if (x.tasks.length) d.tasks = x.tasks.map(t => ({ ...t, date: d.tasks.find(o => o.name === t.name)?.date || "", time: d.tasks.find(o => o.name === t.name)?.time || "" }));
    if (x.topics.length) d.topics = x.topics;
    if (x.lit.length) d.lit = x.lit;
    if (x.bonusMax !== "") d.bonusMax = x.bonusMax;
    if (x.zhMin !== "") d.zhMin = x.zhMin;
    d.totalMin = x.totalMin;
    coNote = x.name || x.tasks.length
      ? `Beolvasva: ${x.name || "név nélkül"}, ${x.tasks.length} számonkérés, ${x.topics.length} ismeretkör. Nézd át, és add meg a dátumokat.`
      : "Ebben a fájlban nem találtam a BGE-sablon mezőit. Töltsd ki kézzel a fontos adatokat.";
  } catch { coNote = "A fájlt nem sikerült beolvasni. Töltsd ki kézzel a mezőket."; }
  drawCourseDialog("");
}

evDlg.addEventListener("change", ev => {

});

/* ===== Tárolás a GitHubon: az eredmények és a dátumok a repó data.json fájljában vannak =====
   Olvasni bárki tud; írni az tud, aki ezen a gépen megadta a saját GitHub-tokenjét (csak ebben a böngészőben marad). */
const GH = { owner: "kittijakab19", repo: "marketing-mesterkepzes", path: "data.json", branch: "main" };
const GH_API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
let STORE = { results: {}, events: {}, courses: {}, meta: {} }, ghSha = null, ghToken = null;
try { ghToken = localStorage.getItem("mm-gh-token"); } catch {}
const toDocs = col => Object.entries(STORE[col] || {}).map(([id, d]) => ({ id, data: () => d }));
function refreshAll() { applyCourses(); applyResults(toDocs("results")); evDocs = toDocs("events"); applyEvents(); if (!editing) render(); }
const b64enc = str => { let b = ""; new TextEncoder().encode(str).forEach(x => { b += String.fromCharCode(x); }); return btoa(b); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), ch => ch.charCodeAt(0)));
const ghHeaders = () => ({ Accept: "application/vnd.github+json", Authorization: "Bearer " + ghToken });
async function ghLoad() {
  if (ghToken) {
    const r = await fetch(`${GH_API}/contents/${GH.path}?ref=${GH.branch}&t=${Date.now()}`, { headers: ghHeaders(), cache: "no-store" });
    if (r.status === 404) { ghSha = null; return { results: {}, events: {} }; }
    if (!r.ok) throw new Error("load " + r.status);
    const j = await r.json(); ghSha = j.sha;
    return JSON.parse(b64dec(j.content));
  }
  const r = await fetch(`${GH.path}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) return { results: {}, events: {} };
  return await r.json();
}
async function ghSave(note) {
  const body = { message: note, content: b64enc(JSON.stringify(STORE, null, 2) + "\n"), branch: GH.branch };
  if (ghSha) body.sha = ghSha;
  const r = await fetch(`${GH_API}/contents/${GH.path}`, { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) throw { code: "conflict" };
  if (r.status === 401 || r.status === 403) throw { code: "invalid_argument" };
  if (!r.ok) throw { code: "unavailable" };
  ghSha = (await r.json()).content?.sha ?? ghSha;
}
/* ugyanaz a felület, amit a szerkesztők használnak: doc("results/<id>").set(...), doc("events/<id>").delete() */
const ghDb = {
  doc(path) {
    const [col, id] = path.split("/");
    const write = async (next, note) => {
      STORE[col] = STORE[col] || {};
      const prev = STORE[col][id];
      if (next === undefined) delete STORE[col][id]; else STORE[col][id] = next;
      try { await ghSave(note); }
      catch (e) {
        if (prev === undefined) delete STORE[col][id]; else STORE[col][id] = prev;
        if (e?.code === "conflict") { await reloadStore(); throw { code: "unavailable" }; }
        throw e;
      }
      refreshAll();
    };
    const label = { results: "Eredmények", events: "Naptár", courses: "Tárgy", meta: "Félévek" }[col] || col;
    return { set: body => write(body, `${label}: ${body.name || byId[body.course]?.name || byId[id]?.name || id}`), delete: () => write(undefined, `${label}: törölve (${id})`) };
  },
};
async function reloadStore() {
  const data = await ghLoad();
  STORE = { results: data.results || {}, events: data.events || {}, courses: data.courses || {}, meta: data.meta || {} };
  refreshAll();
}
async function checkToken(t) {
  const r = await fetch(GH_API, { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + t } });
  if (!r.ok) return false;
  const j = await r.json();
  return !!j.permissions?.push;
}
const lockBtn = document.getElementById("lockBtn");
function drawLock() { lockBtn.classList.toggle("on", canWrite); lockBtn.title = canWrite ? "Szerkesztés bekapcsolva" : "Szerkesztés bekapcsolása"; }
function openLock(err) {
  evDlg.innerHTML = canWrite ? `<form class="dlg" id="lockForm" role="dialog" aria-modal="true" aria-labelledby="lock-h">
      <h2 id="lock-h">Szerkesztés bekapcsolva</h2>
      <p>Ezen a gépen be tudod írni a pontokat és a dátumokat. A mentések a GitHub-repóba kerülnek, és minden eszközön megjelennek.</p>
      <div class="formbtns"><button type="button" class="cancelbtn" id="evCancel">Bezárás</button><button type="button" class="delbtn" id="lockOff">Kijelentkezés ezen a gépen</button></div>
    </form>` : `<form class="dlg" id="lockForm" role="dialog" aria-modal="true" aria-labelledby="lock-h" novalidate>
      <h2 id="lock-h">Szerkesztés bekapcsolása</h2>
      <p>A pontok és a dátumok mentéséhez add meg a saját GitHub-tokenedet. Csak ebben a böngészőben marad, máshova nem kerül.</p>
      <ol><li>Nyisd meg: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></li>

        <li>Permissions → Repository → <b>Contents: Read and write</b></li>
        <li>Generate token, majd másold ide.</li></ol>
      <label class="fld" for="lock-token"><span>GitHub-token</span><input id="lock-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      ${err ? `<p class="formerr" role="alert">${esc(err)}</p>` : ""}

    </form>`;

evDlg.addEventListener("submit", async ev => {
  if (ev.target.id !== "lockForm") return;
  ev.preventDefault(); ev.stopImmediatePropagation();

evDlg.addEventListener("click", ev => {

  if (t.id === "back") return go("naptar");
  if (t.id === "clearday") { state.day = null; return render(); }
  if (t.dataset.month) { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + Number(t.dataset.month), 1); return render(); }
  if (t.dataset.day) { state.day = state.day === t.dataset.day ? null : t.dataset.day; return render(); }
  if (t.dataset.course && byId[t.dataset.course] && byId[t.dataset.course].tile !== false) go("targy", t.dataset.course);
});
document.getElementById("brand").onclick = () => go("naptar");
document.getElementById("nav-naptar").onclick = () => go("naptar");
const toSemester = id => { go("naptar"); try { history.replaceState(null, "", "#" + id); } catch {}
  document.getElementById(id)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); };
document.getElementById("semNav").onclick = ev => { const b = ev.target.closest("[data-sem]"); if (b) toSemester("felev" + b.dataset.sem); };
document.getElementById("nav-kereses").onclick = () => { go("kereses"); q.focus(); };
q.addEventListener("input", () => { if (state.view !== "kereses") { state.view = "kereses"; try { history.replaceState(null, "", "#kereses"); } catch {} } render(); });

/* Sötét / világos mód: a választás megmarad ebben a böngészőben */
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("mm-theme", t); } catch {}
}
try { const saved = localStorage.getItem("mm-theme"); if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved; } catch {}
document.getElementById("themeBtn").onclick = () => setTheme(isDark() ? "light" : "dark");

const h = location.hash.slice(1);
if (byId[h]) { state.view = "targy"; state.course = h; } else if (h === "kereses") state.view = "kereses";
setGrades();
render();
if (/^felev\d+$/.test(h)) document.getElementById(h)?.scrollIntoView();
initResults();
</script>
